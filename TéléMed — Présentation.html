<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TéléMed — Gestion de Projet</title><style>:root{--n:#07111F;--b:#0D1B2A;--c:#42D9F5;--t:#55E6C1;--w:#F4F8FC;--s:#91A4B7}

.s.light{background:var(--w);color:var(--n)}.s.light:before{background:linear-gradient(rgba(13,27,42,.05) 1px,transparent 1px) 0 0/80px 80px,linear-gradient(90deg,rgba(13,27,42,.05) 1px,transparent 1px) 0 0/80px 80px}
.s.on{opacity:1;visibility:visible;transform:none}
h1{font-size:170px;font-weight:800;letter-spacing:-.04em;line-height:1}
h2{font-size:64px;font-weight:700;letter-spacing:-.02em;line-height:1.08;margin-bottom:34px;max-width:1500px}

.row{display:flex;gap:40px}.col{flex:1}
/* 3D */
.sc{perspective:1500px;width:640px;height:640px;position:absolute;right:90px;top:200px}
.sl{position:absolute;left:60px;top:150px;width:460px;height:330px;border-radius:26px;border:1.5px solid rgba(66,217,245,.55);background:linear-gradient(135deg,rgba(66,217,245,.16),rgba(85,230,193,.05)),repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 40px);box-shadow:0 40px 60px rgba(0,0,0,.45);transform:rotateX(62deg) rotateZ(-32deg) translateZ(calc(var(--z)*85px));transition:opacity .8s,border-color .8s,transform 1.2s;padding:30px;font-size:26px;letter-spacing:.2em;color:var(--c);font-weight:700}
.dr .sl{animation:dr 14s ease-in-out infinite alternate}@keyframes dr{to{transform:rotateX(56deg) rotateZ(-22deg) translateZ(calc(var(--z)*85px))}}
.sl.dim{opacity:.35}.sl.hid{opacity:0}.sl.hot{border-color:var(--t);box-shadow:0 0 60px rgba(85,230,193,.35),0 40px 60px rgba(0,0,0,.45);background:linear-gradient(135deg,rgba(85,230,193,.3),rgba(66,217,245,.08))}
.frag{padding:18px 26px;font-size:28px;transition:transform 1.8s cubic-bezier(.2,.8,.2,1) .4s}.frag{transform:translate(var(--x),var(--y)) rotate(var(--a))}.on .frag{transform:none}
table{border-collapse:collapse;width:100%}td,th{font-size:25px;padding:11px 18px;text-align:center;border-bottom:1px solid #d5e0ea}th{font-size:26px;color:#07111F}td:first-child,th:first-child{text-align:left}
.y{color:#0b9a7a;font-weight:800}.p{color:#b7791f;font-weight:700}.n{color:#c0392b;font-weight:800}
.uc{display:flex;gap:24px;align-items:center;padding:12px 26px;margin-bottom:12px}.uc b{font-size:46px;color:var(--c);min-width:110px}.uc p{font-size:21px;margin-top:2px}.uc h3{font-size:27px}
.rk{display:flex;align-items:center;gap:18px;height:63px;padding:0 24px;margin-bottom:5px;border-radius:14px;font-size:24px;white-space:nowrap}.rk b{font-size:34px;min-width:56px;color:var(--c)}.rk.top{background:rgba(66,217,245,.13);border:1px solid rgba(66,217,245,.5);font-size:25px;font-weight:600}.rk span.l{flex:1}
.ui{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:9;opacity:.25;transition:opacity .3s;background:rgba(7,17,31,.85);padding:6px 10px;border-radius:12px}.ui:hover,.ui:focus-within{opacity:1}
.ui button,.ui select{background:#0D1B2A;color:#F4F8FC;border:1px solid #2a4560;border-radius:8px;padding:6px 12px;font:14px inherit;cursor:pointer}#ct{color:#F4F8FC;font:14px monospace;padding:0 8px}
.noanim *{transition:none!important;animation:none!important}.noanim .frag{transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.frag{transform:none}}
.rk .chip{margin:0;font-size:18px;padding:3px 10px}
#rot{display:none}@media(orientation:portrait){#rot{display:block;position:fixed;top:0;left:0;right:0;z-index:20;background:#42D9F5;color:#07111F;text-align:center;padding:8px;font:600 14px system-ui}}</style></head><body>

<script>const U=[0,['Créer un compte','Patient','Haute','Faible',1,'Préalable à toute réservation'],['S’authentifier','Tous','Haute','Moyen',1,'Sécurise l’accès aux données médicales'],['Rechercher un médecin et consulter ses disponibilités','Patient','Haute','Faible',1,'Point d’entrée du parcours patient'],['Réserver un créneau','Patient','Haute','Élevé',1,'Cœur du système ; risque de doubles réservations'],['Choisir présentiel / téléconsultation','Patient','Haute','Élevé',1,'Besoin central du sujet ; dépend de la solution vidéo'],['Programmer un rappel SMS','Système','Moyenne','Moyen',2,'Réduit les rendez-vous manqués ; dépend d’un service SMS externe'],['Consulter le dossier médical','Médecin','Haute','Moyen',2,'Nécessaire à la consultation ; données confidentielles'],['Saisir le diagnostic','Médecin','Haute','Moyen',2,'Cœur de l’activité médicale'],['Éditer une ordonnance numérique','Médecin','Moyenne','Moyen',3,'Dépend du diagnostic ; contraintes de conformité'],['Programmer un suivi','Médecin','Basse','Faible',3,'Fonction complémentaire, non bloquante'],['Gérer le planning','Secrétaire','Haute','Moyen',2,'Repose sur les réservations déjà disponibles'],['Enregistrer un paiement','Secrétaire','Moyenne','Moyen',3,'Utile mais indépendant du parcours médical']];

const uml=`<svg viewBox="0 0 1200 690" style="width:100%;height:860px">${defs}<rect x="240" y="8" width="940" height="672" rx="10" fill="rgba(255,255,255,.03)" stroke="#91A4B7"/><text x="710" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#F4F8FC">Système TéléMed</text>
${ln(110,130,300,125,1)}${ln(110,130,300,205,1)}${ln(110,130,290,55,1)}${ln(110,140,300,300,1)}${ln(110,420,300,390,1)}${ln(110,420,300,460,1)}${ln(110,420,300,300,1)}${ln(110,565,300,300,1)}${ln(110,565,290,540,1)}${ln(110,568,300,620,1)}<polyline ${RO(1)} points="110,575 110,665 1030,665 1030,650" fill="none" stroke="#91A4B7" stroke-width="1.2"/><polyline ${RO(1)} points="730,665 730,650" fill="none" stroke="#91A4B7" stroke-width="1.2"/>
${uc(420,62,135,['Rechercher un médecin','et consulter ses disponibilités'],2)}${uc(420,125,100,['Créer un compte'],2)}${uc(420,205,110,['Réserver un créneau'],2)}${uc(420,300,100,['S’authentifier'],2)}${uc(420,390,130,['Enregistrer un paiement'],2)}${uc(420,460,100,['Gérer le planning'],2)}${uc(420,540,110,['Programmer un suivi'],2)}${uc(420,620,130,['Éditer une','ordonnance numérique'],2)}${uc(900,140,120,['Choisir présentiel /','téléconsultation'],3)}${uc(900,250,120,['Programmer un','rappel SMS'],3)}${uc(740,620,100,['Saisir le diagnostic'],3)}${uc(1040,620,120,['Consulter le','dossier médical'],3)}
${ln(530,196,782,152,4,1,'include')}${ln(520,214,782,248,4,1,'include')}${ln(550,620,640,620,5,1,'extend')}${ln(500,530,720,592,5,1,'extend')}${ln(840,620,920,620,5,1,'include')}
${act(80,130,'Patient',1)}${act(80,420,'Secrétaire médical',1)}${act(80,565,'Médecin',1)}</svg>`;

const B=[['Recherche d’un médecin par spécialité','✓','Partiel','✓'],['Réservation en ligne d’un créneau','✓','✓','✓'],['Choix présentiel / téléconsultation','✓','×','✓'],['Téléconsultation vidéo','✓','✓','✓'],['Dossier médical électronique','✓','Partiel','✓'],['Ordonnance numérique','✓','✓','✓'],['Gestion du planning du cabinet','✓','Partiel','✓'],['Paiement et facturation intégrés','✓','✓','✓'],['Rappels automatiques (SMS / e-mail)','✓','Partiel','✓']];

const net=`<svg viewBox="0 0 400 300" style="width:420px;position:absolute;right:90px;bottom:70px">${[[200,40],[330,100],[330,200],[200,260],[70,200],[70,100]].map(([x,y],i)=>`<line x1="200" y1="150" x2="${x}" y2="${y}" stroke="#42D9F5" stroke-width="1.5" ${RO(i+3)}/><circle cx="${x}" cy="${y}" r="16" fill="#0D1B2A" stroke="#55E6C1" stroke-width="2" ${RO(i+3)}/>`).join('')}<circle cx="200" cy="150" r="34" fill="#42D9F5" ${RO(2)}/><text x="200" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#07111F" ${RO(2)}>TéléMed</text></svg>`;
const S=[
`<div style="margin-top:210px;width:1100px"><div class="k r" data-i="0">Projet de Gestion de Projet · ESSECT Tunis</div><h1 class="r" data-i="1">TÉLÉ<span class="ac">MED</span></h1><h3 class="r mut" data-i="2" style="font-size:44px;font-weight:400;margin:20px 0 70px">Système de Télémédecine et Cabinet Médical</h3><p class="r" data-i="3">Ranim Neji · Yasmine Arem · Amine Khlif · Moncef Zbidi</p><p class="r mut" data-i="4" style="font-size:26px;margin-top:12px">9 octobre 2026 · Système proposé (phase de conception)</p></div><div class="sc dr" style="right:60px;top:180px"><div class="sl" style="--z:0"></div><div class="sl" style="--z:1"></div><div class="sl" style="--z:2"></div><div class="sl" style="--z:3;border-color:#55E6C1"></div></div>`,
`${T('Le problème','Un cabinet médical encore trop dépendant des processus manuels.')}<div class="row"><div class="col"><ul>${['Réservation par téléphone','Planning papier','Dossiers médicaux physiques','Relances manuelles','Doubles réservations et rendez-vous manqués','Charge administrative pour le secrétariat'].map((x,i)=>`<li ${R(i)} style="font-size:34px;margin-bottom:18px"><span class="ac">—</span> ${x}</li>`).join('')}</ul></div><div class="col glass" style="padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start"><div class="k" style="grid-column:1/3">Vers un environnement unifié</div>${['Réservation en ligne','Planning numérique','Dossier numérique','Rappels automatiques','Choix du mode de consultation','Suivi centralisé'].map((x,i)=>`<div class="glass frag" style="--x:${[-700,-300,500,-500,300,650][i]}px;--y:${[-200,300,-250,150,-300,200][i]}px;--a:${[-14,9,-6,12,-10,7][i]}deg">${x}</div>`).join('')}</div></div>`,
`<div class="k">Problématique</div><div style="font-size:300px;font-weight:800;color:transparent;-webkit-text-stroke:2px rgba(66,217,245,.35);position:absolute;right:120px;top:20px;line-height:1">?</div><h2 class="r" data-i="1" style="font-size:62px;max-width:1450px;margin-top:130px;line-height:1.2">Comment concevoir un système d’information permettant à un cabinet médical d’<span class="ac">automatiser la prise de rendez-vous</span> et le suivi médical, tout en offrant au patient le choix entre une consultation <span class="tl">en présentiel</span> et une <span class="tl">téléconsultation</span> ?</h2>`,
`${T('Notre proposition','Une plateforme. Un parcours médical unifié.')}<p class="mut" style="margin:-10px 0 70px">Capacités proposées dans notre conception — système non implémenté.</p><div style="display:flex;position:relative;margin-top:60px"><div style="position:absolute;top:44px;left:60px;right:60px;height:3px;background:linear-gradient(90deg,#42D9F5,#55E6C1)"></div>${['Rechercher un médecin','Consulter ses disponibilités','Réserver un créneau','Choisir présentiel ou téléconsultation','Assurer le suivi médical','Gérer les rappels et les paiements'].map((x,i)=>`<div ${R(i)} style="flex:1;text-align:center;padding:0 10px"><div style="width:90px;height:90px;border-radius:50%;margin:0 auto 26px;background:#0D1B2A;border:3px solid #42D9F5;display:grid;place-items:center;font-size:40px;font-weight:700;color:#42D9F5;box-shadow:0 0 40px rgba(66,217,245,.3)">${i+1}</div><h3 style="font-size:28px">${x}</h3></div>`).join('')}</div>`,
